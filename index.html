<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Darkhollow Depths</title>
   </head>
   <body>
      <header>
         <h1>DARKHOLLOW DEPTHS</h1>
         <p class="subtitle">a roguelike of the forsaken crypts</p>
      </header>

      <main>
         <aside class="panel" id="stats-panel"></aside>

         <section id="stage">
            <canvas id="game-canvas"></canvas>
            <canvas id="epilogue-canvas" class="hidden"></canvas>
            <canvas id="minimap" class="hidden"></canvas>
            <div id="epilogue-text" class="hidden"></div>
            <div id="inventory-hud" class="hud-panel hidden">
               <h3>Pack</h3>
               <div id="inventory-hud-content"></div>
            </div>
            <div id="character-hud" class="hud-panel hud-right hidden">
               <h3>The Adventurer</h3>
               <div id="character-hud-content"></div>
            </div>
            <button id="fullscreen-btn" title="Toggle fullscreen (F)">⛶</button>
            <div id="overlay" class="hidden">
               <h2 id="overlay-title"></h2>
               <p id="overlay-body"></p>
               <div id="overlay-buttons"></div>
            </div>
            <div id="dpad">
               <span></span>
               <button data-dir="0,-1">▲</button>
               <span></span>
               <button data-dir="-1,0">◀</button>
               <button data-act="descend">▼▼</button>
               <button data-dir="1,0">▶</button>
               <span></span>
               <button data-dir="0,1">▼</button>
               <span></span>
            </div>
         </section>

         <aside class="panel" id="side-panel">
            <h3>Inventory</h3>
            <div id="inventory"></div>
            <h3>Crafting</h3>
            <div id="crafting"></div>
         </aside>
      </main>

      <footer class="panel" id="log"></footer>

      <script type="module" src="/src/main.js"></script>
   </body>
</html>
